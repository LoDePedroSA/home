<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LDP Downloader · Gestor de Archivos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0b0e17, #03050a);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .downloader-card {
            max-width: 620px;
            width: 100%;
            background: rgba(15, 20, 30, 0.75);
            backdrop-filter: blur(14px);
            border-radius: 48px;
            padding: 2.2rem 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(59, 130, 246, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: cardGlow 0.9s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            text-align: center;
        }

        .downloader-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 32px 55px rgba(0, 0, 0, 0.6), 0 0 0 1px #3b82f6;
        }

        @keyframes cardGlow {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(20px);
                backdrop-filter: blur(0px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                backdrop-filter: blur(14px);
            }
        }

        .icon-header {
            font-size: 3.8rem;
            margin-bottom: 0.75rem;
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            animation: iconFloat 2s infinite ease-in-out;
        }

        @keyframes iconFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(120deg, #f0f4ff, #b9d0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.3px;
        }

        .sub {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-weight: 400;
            border-bottom: 1px dashed #2d3a4e;
            display: inline-block;
            padding-bottom: 6px;
        }

        .file-info-panel {
            background: #0a0f18cc;
            border-radius: 2rem;
            padding: 1.2rem;
            margin: 1.5rem 0;
            border: 1px solid #2d3a55;
            transition: all 0.2s;
        }

        .file-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
            color: #7e8aa2;
        }

        .file-name {
            font-size: 1.55rem;
            font-weight: 800;
            font-family: 'Monaco', 'Menlo', monospace;
            background: #01030a;
            padding: 0.5rem 1rem;
            border-radius: 60px;
            display: inline-block;
            margin-top: 0.5rem;
            word-break: break-all;
            color: #7aaef5;
            border: 1px solid #2c3e66;
            box-shadow: inset 0 1px 2px #00000030, 0 2px 5px #00000020;
        }

        .status-message {
            margin: 1.8rem 0 1.2rem;
            padding: 1rem 1.4rem;
            border-radius: 80px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.05rem;
            background: #0f1422;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            border-left: 5px solid;
        }

        .status-success {
            background: #0a1f1acc;
            border-left-color: #10b981;
            color: #b5ffdf;
        }

        .status-error {
            background: #2a121acc;
            border-left-color: #ef4444;
            color: #ffbcbc;
        }

        .status-waiting {
            background: #121826cc;
            border-left-color: #facc15;
            color: #ffe5a3;
        }

        .retry-button {
            background: linear-gradient(95deg, #1f2a48, #111827);
            border: none;
            padding: 0.7rem 1.9rem;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            margin-top: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            border: 1px solid #3b4a6b;
        }

        .retry-button:hover {
            background: #2a3b60;
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(59,130,246,0.3);
            border-color: #5b7bcb;
        }

        .retry-button:active {
            transform: scale(0.97);
        }

        .loader-dots {
            display: inline-flex;
            gap: 4px;
            margin-left: 8px;
        }

        .loader-dots span {
            width: 7px;
            height: 7px;
            background: #93c5fd;
            border-radius: 50%;
            display: inline-block;
            animation: pulseDot 1.2s infinite ease;
        }

        .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loader-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; transform: scale(0.8);}
            50% { opacity: 1; transform: scale(1.2); background: #60a5fa;}
        }

        footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #4b556b;
        }

        a {
            color: #7e9ef5;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="downloader-card" id="downloaderRoot">
    <div class="icon-header">
        ⬇️📁
    </div>
    <h1>LDP · Download Manager</h1>
    <div class="sub">extracción segura de activos</div>

    <div class="file-info-panel">
        <div class="file-label">📄 ARCHIVO SOLICITADO</div>
        <div class="file-name" id="fileNameDisplay">—</div>
    </div>

    <div id="statusArea" class="status-message status-waiting">
        <span>⏳</span> <span id="statusText">Inicializando descarga...</span>
        <div class="loader-dots" id="loaderDots"><span></span><span></span><span></span></div>
    </div>

    <button class="retry-button" id="manualRetryBtn">
        🔁 Reintentar descarga
    </button>
    <footer>
        ⚡ Modo automático · Basado en parámetros URL
    </footer>
</div>

    <script>
    (function() {
        let archivo = null;
        const queryString = window.location.search;

        if (queryString && queryString.length > 1) {
            if (queryString.startsWith('?=')) {
                archivo = queryString.substring(2);
                const ampIndex = archivo.indexOf('&');
                if (ampIndex !== -1) archivo = archivo.substring(0, ampIndex);
                const hashIndex = archivo.indexOf('#');
                if (hashIndex !== -1) archivo = archivo.substring(0, hashIndex);
                archivo = decodeURIComponent(archivo);
            } else {
                const urlParams = new URLSearchParams(queryString);
                if (urlParams.has('archivo')) {
                    archivo = urlParams.get('archivo');
                } else if (urlParams.has('file')) {
                    archivo = urlParams.get('file');
                } else {
                    const match = queryString.match(/^\?(.+?)(?:&|$)/);
                    if (match && match[1]) {
                        archivo = decodeURIComponent(match[1]);
                    }
                }
            }
        }

        if (archivo) archivo = archivo.trim();

        const fileNameSpan = document.getElementById('fileNameDisplay');
        const statusTextSpan = document.getElementById('statusText');
        const statusAreaDiv = document.getElementById('statusArea');
        const loaderDotsSpan = document.getElementById('loaderDots');
        const retryBtn = document.getElementById('manualRetryBtn');

        function setStatus(type, message, showLoader = false) {
            statusTextSpan.innerText = message;
            statusAreaDiv.classList.remove('status-success', 'status-error', 'status-waiting');
            if (showLoader && loaderDotsSpan) loaderDotsSpan.style.display = 'inline-flex'; else if (loaderDotsSpan) loaderDotsSpan.style.display = 'none';
            if (type === 'success') statusAreaDiv.classList.add('status-success'); else if (type === 'error') statusAreaDiv.classList.add('status-error'); else statusAreaDiv.classList.add('status-waiting');
        }

        function hideLoader() { if (loaderDotsSpan) loaderDotsSpan.style.display = 'none'; }

        async function descargarArchivo(nombreArchivo) {
            if (!nombreArchivo || nombreArchivo === "") {
                setStatus('error', '❌ No se especificó ningún archivo en la URL.', false);
                hideLoader();
                return false;
            }

            const rutaDescarga = `./${nombreArchivo}`;

            try {
                setStatus('waiting', `⏳ Descargando "${nombreArchivo}" ...`, true);
                const response = await fetch(rutaDescarga, {
                    method: 'GET',
                    credentials: 'same-origin',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (!response.ok) {
                    let errorDetail = `HTTP ${response.status} ${response.statusText}`;
                    if (response.status === 404) errorDetail = `Archivo no encontrado (404)`;
                    throw new Error(`No se pudo acceder al archivo: ${errorDetail}`);
                }

                const blob = await response.blob();
                if (blob.size === 0) throw new Error(`El archivo "${nombreArchivo}" está vacío o no contiene datos.`);

                const blobUrl = window.URL.createObjectURL(blob);
                const linkDescarga = document.createElement('a');
                linkDescarga.href = blobUrl;
                let nombreSalida = nombreArchivo;
                if (nombreArchivo.includes('/')) {
                    const partes = nombreArchivo.split('/');
                    nombreSalida = partes[partes.length - 1];
                }
                linkDescarga.download = nombreSalida;
                document.body.appendChild(linkDescarga);
                linkDescarga.click();
                document.body.removeChild(linkDescarga);
                window.URL.revokeObjectURL(blobUrl);

                setStatus('success', `✅ "${nombreArchivo}" se ha descargado correctamente.`, false);
                hideLoader();
                return true;

            } catch (error) {
                console.error('Error en descarga:', error);
                let mensajeError = `❌ "${nombreArchivo}" no se ha podido descargar.`;
                if (error.message) mensajeError += ` (${error.message})`; else mensajeError += ` Error: ${error}`;
                setStatus('error', mensajeError, false);
                hideLoader();
                return false;
            }
        }

        function actualizarUIArchivo(mostrar) {
            if (mostrar && mostrar !== "") {
                fileNameSpan.innerText = mostrar;
                if (mostrar.length > 80) {
                    fileNameSpan.innerText = mostrar.substring(0, 77) + '...';
                    fileNameSpan.title = mostrar;
                } else {
                    fileNameSpan.title = mostrar;
                }
            } else {
                fileNameSpan.innerText = "⚠️ No especificado";
                fileNameSpan.title = "Faltó el parámetro en la URL";
            }
        }

        function iniciarProceso() {
            if (!archivo || archivo === "") {
                actualizarUIArchivo(null);
                setStatus('error', '⚠️ Parámetro inválido. Uso: ?=nombre.extension', false);
                hideLoader();
                fileNameSpan.innerText = "❌ No definido";
                return;
            }

            let nombreMostrar = archivo;
            try { nombreMostrar = decodeURIComponent(archivo); } catch(e) {}

            const rutaDescarga = `./${archivo}`;
            const displayUrl = new URL(rutaDescarga, window.location.href).href;
            actualizarUIArchivo(displayUrl);

            descargarArchivo(archivo);
        }

        function reintentarDescarga() {
            if (archivo && archivo !== "") {
                setStatus('waiting', `🔄 Reintentando descarga de "${archivo}" ...`, true);
                descargarArchivo(archivo);
            } else {
                setStatus('error', 'No hay un archivo válido para reintentar. Verifica la URL.', false);
                hideLoader();
            }
        }

        if (retryBtn) retryBtn.addEventListener('click', reintentarDescarga);

        if (!archivo) {
            fileNameSpan.innerText = "📭 (ninguno)";
            setStatus('error', '⚠️ Error: No se encontró el parámetro en la URL. Ejemplo: downloader.html?=documento.pdf', false);
            hideLoader();
            const panelInfo = document.querySelector('.file-info-panel');
            if (panelInfo) {
                const hint = document.createElement('div');
                hint.style.marginTop = '12px';
                hint.style.fontSize = '0.75rem';
                hint.style.color = '#9aa9c1';
                hint.innerText = '💡 Uso correcto: /downloader.html?=archivo.ext  (o ?archivo=nombre)';
                panelInfo.appendChild(hint);
            }
        } else {
            iniciarProceso();
        }

        let descargaEnProgreso = false;
        const originalDescargar = descargarArchivo;
        window.descargarArchivo = descargarArchivo;

        function descargarConMutex(nombreArchivo) {
            if (descargaEnProgreso) {
                setStatus('waiting', '⏳ Ya hay una descarga en curso, espera...', true);
                return Promise.resolve(false);
            }
            descargaEnProgreso = true;
            return originalDescargar(nombreArchivo).finally(() => { descargaEnProgreso = false; });
        }

        window.descargarArchivo = descargarConMutex;
        descargarArchivo = descargarConMutex;
        const globalDescargarRef = descargarConMutex;

        function finalPatch() { window.__downloadFn = globalDescargarRef; }
        finalPatch();

        if (retryBtn) {
            const newBtn = retryBtn.cloneNode(true);
            retryBtn.parentNode.replaceChild(newBtn, retryBtn);
            newBtn.addEventListener('click', () => {
                if (archivo) {
                    setStatus('waiting', `🔄 Reintentando "${archivo}" ...`, true);
                    globalDescargarRef(archivo);
                } else {
                    setStatus('error', 'No hay archivo asociado', false);
                    hideLoader();
                }
            });
        }

        if (archivo && archivo.includes('%')) {
            try {
                let decodificado = decodeURIComponent(archivo);
                if (decodificado !== archivo) {
                    archivo = decodificado;
                    actualizarUIArchivo(archivo);
                }
            } catch(e) {}
        }

        console.log(`[LDP Downloader] Parámetro recibido: "${archivo}"`);
        if (archivo) console.log(`[LDP] Iniciando descarga de: ./${archivo}`); else console.warn('[LDP] No se proporcionó archivo en query string. Usa ?=nombre.ext o ?archivo=nombre');
    })();
    </script>
</body>
</html>
